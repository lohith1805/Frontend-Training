<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZenField Profile</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"></head><body><div class="overlay"></div><div class="app"><aside class="sidebar"><a class="brand" href="index.html"><span class="brand-icon"><i class="bi bi-bar-chart-fill"></i></span><span>ZenField</span></a><div class="menu-title">Menu</div><a class="nav-link-custom" href="index.html"><i class="bi bi-grid"></i>Dashboard</a><a class="nav-link-custom" href="tables.html"><i class="bi bi-table"></i>Tables</a><a class="nav-link-custom" href="charts.html"><i class="bi bi-pie-chart"></i>Charts</a><a class="nav-link-custom" href="analytics.html"><i class="bi bi-graph-up-arrow"></i>Analytics</a><a class="nav-link-custom active" href="profile.html"><i class="bi bi-person-circle"></i>User Profile</a></aside><main class="main"><header class="topbar"><div class="d-flex align-items-center gap-3"><button class="icon-btn mobile-toggle" data-toggle-sidebar><i class="bi bi-list"></i></button><div class="search"><i class="bi bi-search fs-4"></i><span>Search or type command...</span><span class="ms-auto badge rounded-pill text-bg-secondary">⌘ K</span></div></div><div class="d-flex align-items-center gap-3"><button class="icon-btn" data-theme-toggle><i class="bi bi-sun"></i></button><button class="icon-btn"><i class="bi bi-bell"></i></button><div class="user-menu"><button class="user-trigger"><img class="avatar" src="assets/images/user/owner.jpg"><span data-profile-name>Musharof</span><i class="bi bi-chevron-down"></i></button><div class="dropdown-panel"><a href="profile.html"><i class="bi bi-pencil-square"></i>Edit Profile</a><a href="signin.html?signedout=1"><i class="bi bi- <div class="mb-4"><h2 class="fw-bold">User Profile</h2><p class="muted">Edit profile details and save changes.</p></div><div class="row g-4"><div class="col-xl-4"><div class="cardx chart-card text-center"><img class="avatar mb-3" style="width:110px;height:110px" src="assets/images/user/owner.jpg"><h3 data-profile-name>Musharof</h3><p class="muted" data-profile-role>Admin</p><hr><p class="mb-1"><strong>Email:</strong> <span data-profile-email></span></p><p class="mb-1"><strong>Company:</strong> <span data-profile-company></span></p><p class="muted mt-3" data-profile-bio></p></div></div><div class="col-xl-8"><form id="profileForm" class="cardx chart-card"><h4 class="fw-bold mb-4">Profile Settings</h4><div class="row g-3"><div class="col-md-6"><label class="form-label">Name</label><input id="profileName" class="form-control"></div><div class="col-md-6"><label class="form-label">Role</label><input id="profileRole" class="form-control"></div><div class="col-md-6"><label class="form-label">Email</label><input id="profileEmail" class="form-control"></div><div class="col-md-6"><label class="form-label">Company</label><input id="profileCompany" class="form-control"></div><div class="col-12"><label class="form-label">Bio</label><textarea id="profileBio" rows="4" class="form-control"></textarea></div></div><button class="btn btn-primary mt-4" type="submit">Save Changes</button></form></div></div></section></main></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script src="assets/js/script.js"></script></body></html>
