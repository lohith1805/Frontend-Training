<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analytics | EmpManager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <a class="brand" href="index.html"><span class="brand-icon"><i class="bi bi-grid-1x2-fill"></i></span><span>EmpManager</span></a>
      <div class="sidebar-label">Main Menu</div>
      <a class="sidebar-link " href="index.html"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a>
      <a class="sidebar-link " href="registration.html"><i class="bi bi-person-plus"></i><span>Add Employee</span></a>
      <a class="sidebar-link " href="profiles.html"><i class="bi bi-person-badge"></i><span>Employee Profiles</span></a>
      <a class="sidebar-link " href="employees.html"><i class="bi bi-table"></i><span>Employee Table</span></a>
      <a class="sidebar-link active" href="analytics.html"><i class="bi bi-bar-chart-line"></i><span>Analytics</span></a>
    </aside>
    <div class="sidebar-backdrop"></div>
    <main class="main-content">
      <header class="topbar">
        <div class="d-flex align-items-center gap-3">
          <button class="menu-btn" type="button"><i class="bi bi-list fs-4"></i></button>
          <div>
            <h1 class="page-title">Analytics</h1>
            <p class="page-subtitle">Visual employee data using simple charts for dashboard reporting.</p>
          </div>
        </div>
        <div class="d-none d-md-flex align-items-center gap-3">
          <span class="small-muted">Admin</span>
          <div class="table-avatar">AD</div>
        </div>
      </header>
      <section class="content-wrapper">
        <div class="row g-4">
  <div class="col-lg-6"><div class="card-panel"><h2 class="panel-title">Attendance This Week</h2><div class="chart-box"><canvas id="attendanceChart"></canvas></div></div></div>
  <div class="col-lg-6"><div class="card-panel"><h2 class="panel-title">Performance Overview</h2><div class="chart-box"><canvas id="performanceChart"></canvas></div></div></div>
  <div class="col-lg-6"><div class="card-panel"><h2 class="panel-title">Department Split</h2><div class="chart-box"><canvas id="deptChart"></canvas></div></div></div>
  <div class="col-lg-6"><div class="card-panel"><h2 class="panel-title">Hiring Trend</h2><div class="chart-box"><canvas id="hiringChart"></canvas></div></div></div>
</div>
      </section>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script.js"></script>
</body>
</html>
