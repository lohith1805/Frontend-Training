<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Employee | EmpManager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <a class="brand" href="index.html"><span class="brand-icon"><i class="bi bi-grid-1x2-fill"></i></span><span>EmpManager</span></a>
      <div class="sidebar-label">Main Menu</div>
      <a class="sidebar-link " href="index.html"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a>
      <a class="sidebar-link active" href="registration.html"><i class="bi bi-person-plus"></i><span>Add Employee</span></a>
      <a class="sidebar-link " href="profiles.html"><i class="bi bi-person-badge"></i><span>Employee Profiles</span></a>
      <a class="sidebar-link " href="employees.html"><i class="bi bi-table"></i><span>Employee Table</span></a>
      <a class="sidebar-link " href="analytics.html"><i class="bi bi-bar-chart-line"></i><span>Analytics</span></a>
    </aside>
    <div class="sidebar-backdrop"></div>
    <main class="main-content">
      <header class="topbar">
        <div class="d-flex align-items-center gap-3">
          <button class="menu-btn" type="button"><i class="bi bi-list fs-4"></i></button>
          <div>
            <h1 class="page-title">Add Employee</h1>
            <p class="page-subtitle">Register new employee details using a responsive Bootstrap form.</p>
          </div>
        </div>
        <div class="d-none d-md-flex align-items-center gap-3">
          <span class="small-muted">Admin</span>
          <div class="table-avatar">AD</div>
        </div>
      </header>
      <section class="content-wrapper">
        <div class="form-card">
  <form id="empForm">
    <div class="row g-4">
      <div class="col-md-6"><label class="form-label">First Name</label><input type="text" class="form-control custom-input" placeholder="e.g. Arjun" required></div>
      <div class="col-md-6"><label class="form-label">Last Name</label><input type="text" class="form-control custom-input" placeholder="e.g. Sharma" required></div>
      <div class="col-md-6"><label class="form-label">Email Address</label><input type="email" class="form-control custom-input" placeholder="arjun@company.com" required></div>
      <div class="col-md-6"><label class="form-label">Phone Number</label><input type="tel" class="form-control custom-input" placeholder="+91 XXXXX XXXXX"></div>
      <div class="col-md-6"><label class="form-label">Department</label><select class="form-select custom-input" required><option value="">Select Department</option><option>Engineering</option><option>Design</option><option>Marketing</option><option>Finance</option><option>HR</option><option>Operations</option></select></div>
      <div class="col-md-6"><label class="form-label">Role</label><input type="text" class="form-control custom-input" placeholder="e.g. Frontend Developer" required></div>
      <div class="col-md-6"><label class="form-label">Date of Joining</label><input type="date" class="form-control custom-input"></div>
      <div class="col-md-6"><label class="form-label">Employment Type</label><select class="form-select custom-input"><option>Full-time</option><option>Part-time</option><option>Contract</option><option>Intern</option></select></div>
      <div class="col-12"><label class="form-label">Address</label><textarea class="form-control custom-input" rows="3" placeholder="Full address"></textarea></div>
      <div class="col-12 d-flex gap-3 flex-wrap"><button type="submit" class="btn btn-primary-custom px-5"><i class="bi bi-person-plus me-2"></i>Register Employee</button><button type="reset" class="btn btn-outline-custom px-4"><i class="bi bi-arrow-counterclockwise me-2"></i>Reset</button></div>
    </div>
  </form>
</div>
      </section>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script.js"></script>
</body>
</html>
