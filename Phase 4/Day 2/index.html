<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Management System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <header>
      <h1>Employee Management System</h1>
      <span class="badge" id="empCount">0 Employees</span>
    </header>

    <!-- Add Employee Form -->
    <div class="card form-card">
      <h2>Add New Employee</h2>
      <div class="form-row">
        <div class="field">
          <label for="empName">Full Name</label>
          <input type="text" id="empName" placeholder="e.g. John Smith" />
          <span class="error" id="nameError"></span>
        </div>
        <div class="field">
          <label for="empRole">Role</label>
          <input type="text" id="empRole" placeholder="e.g. Frontend Developer" />
          <span class="error" id="roleError"></span>
        </div>
        <div class="field">
          <label for="empSalary">Salary (₹)</label>
          <input type="number" id="empSalary" placeholder="e.g. 50000" />
          <span class="error" id="salaryError"></span>
        </div>
        <div class="field btn-field">
          <button id="addBtn" onclick="handleAdd()">+ Add Employee</button>
        </div>
      </div>
    </div>

    <!-- Employee List -->
    <div class="card list-card">
      <div class="list-header">
        <h2>Employee List</h2>
        <button class="clear-btn" onclick="clearAll()">Clear All</button>
      </div>
      <div id="empList" class="emp-grid">
        <p class="empty-msg">No employees added yet.</p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
